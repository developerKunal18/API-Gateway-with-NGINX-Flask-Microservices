version: "3.9"

services:

  gateway:
    image: nginx:latest

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      - user-service
      - product-service
      - order-service

  user-service:
    build: ./user_service

  product-service:
    build: ./product_service

  order-service:
    build: ./order_service
